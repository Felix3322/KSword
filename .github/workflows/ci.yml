name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      usermode: ${{ steps.detect.outputs.usermode }}
      setup: ${{ steps.detect.outputs.setup }}
      arklight: ${{ steps.detect.outputs.arklight }}
      ce_plugin: ${{ steps.detect.outputs.ce_plugin }}
      ce_launcher: ${{ steps.detect.outputs.ce_launcher }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate CI path rules
        run: python3 tools/ci/changed_paths.py validate-patterns

      - name: Detect changed project inputs
        id: detect
        run: >-
          python3 tools/ci/changed_paths.py detect
          --mode projects
          --event-name "${{ github.event_name }}"
          --event-path "$GITHUB_EVENT_PATH"
          --event-sha "${{ github.sha }}"
          --github-output "$GITHUB_OUTPUT"

  source-integrity:
    name: Source integrity
    needs: changes
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test CI change-range resolver
        shell: pwsh
        run: python -m unittest discover -s tools/ci/tests -p 'test_*.py' -v

      - name: Check changed-file whitespace
        shell: pwsh
        run: >-
          python tools/ci/changed_paths.py check-whitespace
          --event-name "${{ github.event_name }}"
          --event-path "$env:GITHUB_EVENT_PATH"
          --event-sha "${{ github.sha }}"

      - name: Validate tracked JSON
        shell: pwsh
        run: |
          @'
          import json
          import subprocess

          paths = subprocess.check_output(
              ["git", "ls-files", "--", "*.json"], text=True
          ).splitlines()
          for raw_path in paths:
              with open(raw_path, encoding="utf-8") as source:
                  json.load(source)
          print(f"Validated {len(paths)} tracked JSON file(s).")
          '@ | python -

      - name: Audit language packs
        run: >-
          python tools/i18n_language_pack.py audit
          --source-root Ksword5.1/Ksword5.1
          --zh-pack Ksword5.1/Ksword5.1/languages/zh-CN.json
          --en-pack Ksword5.1/Ksword5.1/languages/en-US.json

      - name: Audit IOCTL registry and access policy
        run: >-
          python tools/ioctl_audit/ksword_ioctl_audit.py
          --repo-root .
          --format markdown
          --out artifacts/ioctl-audit.md

      - name: Upload IOCTL audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ioctl-audit
          path: artifacts/ioctl-audit.md
          if-no-files-found: warn

  usermode-release:
    name: User-mode Release build
    needs:
      - changes
      - source-integrity
    if: needs.changes.outputs.usermode == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_msvc2022_64
          modules: 'qtcharts qtmultimedia'
          cache: true

      - name: Install Qt MSBuild files
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'qt-msbuild.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'qt-msbuild'
          Invoke-WebRequest `
            -Uri 'https://download.qt.io/official_releases/vsaddin/3.5.0/qt-vsaddin-msbuild-3.5.0.zip' `
            -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $destination -Force
          $targets = Get-ChildItem -Path $destination -Filter qt.targets -Recurse -File |
            Select-Object -First 1
          if ($null -eq $targets) {
            throw 'Qt MSBuild archive did not contain qt.targets.'
          }
          "KSWORD_QT_MSBUILD=$($targets.Directory.FullName)" | Add-Content -Path $env:GITHUB_ENV

      - name: Build supported user-mode Release targets
        shell: pwsh
        run: |
          $env:KSWORD_QT_DIR = $env:QT_ROOT_DIR
          $env:QTDIR = $env:QT_ROOT_DIR
          if (-not (Test-Path (Join-Path $env:KSWORD_QT_MSBUILD 'qt.targets'))) {
            throw "Qt MSBuild path is invalid: $env:KSWORD_QT_MSBUILD"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }

          # The release DynData pack is intentionally generated from the private,
          # reviewed PDB corpus and is not tracked in this source repository. The
          # Launcher project requires a v3 pack only to generate its compile-time
          # support manifest, so use an empty CI-only fixture. It is never copied
          # to a release artifact or published.
          $ciProfiles = 'Ksword5.1/Ksword5.1/profiles'
          New-Item -ItemType Directory -Path $ciProfiles -Force | Out-Null
          @'
          {
            "packVersion": 3,
            "profiles": []
          }
          '@ | Set-Content -LiteralPath (Join-Path $ciProfiles 'ark_dyndata_pack_v3.json') -Encoding utf8

          $properties = @(
            '/t:Build',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            "/p:QtMsBuild=$env:KSWORD_QT_MSBUILD",
            '/p:KswordArkSkipAutoTestSign=true',
            '/m:1',
            '/v:minimal'
          )
          $projects = @(
            'Ksword5.1/Ksword5.1/Ksword5.1.vcxproj',
            'Launcher/Launcher.vcxproj',
            'Taskbar/Taskbar.vcxproj',
            'KswordHUD/KswordHUD.vcxproj',
            'APIMonitor_x64/APIMonitor_x64.vcxproj',
            'KswordCLI/KswordCLI.vcxproj'
          )
          foreach ($project in $projects) {
            & $msbuild $project @properties
            if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed for $project with exit code $LASTEXITCODE."
            }
          }

      - name: Verify primary build artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'Ksword5.1/x64/Release/Ksword5.1.exe',
            'Ksword5.1/x64/Release/Launcher.exe',
            'Ksword5.1/x64/Release/Taskbar.exe',
            'Ksword5.1/x64/Release/KswordHUD.exe',
            'Ksword5.1/x64/Release/APIMonitor_x64.dll',
            'Ksword5.1/x64/Release/KswordCLI.exe'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected Release artifact(s) missing: $($missing -join ', ')"
          }

  ksword-setup:
    name: KswordSetup Release build
    needs:
      - changes
      - source-integrity
    if: needs.changes.outputs.setup == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt for payload prerequisite
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_msvc2022_64
          modules: 'qtcharts qtmultimedia'
          cache: true

      - name: Install Qt MSBuild files
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'qt-msbuild.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'qt-msbuild'
          Invoke-WebRequest `
            -Uri 'https://download.qt.io/official_releases/vsaddin/3.5.0/qt-vsaddin-msbuild-3.5.0.zip' `
            -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $destination -Force
          $targets = Get-ChildItem -Path $destination -Filter qt.targets -Recurse -File |
            Select-Object -First 1
          if ($null -eq $targets) {
            throw 'Qt MSBuild archive did not contain qt.targets.'
          }
          "KSWORD_QT_MSBUILD=$($targets.Directory.FullName)" | Add-Content -Path $env:GITHUB_ENV

      - name: Build payload prerequisite and installer
        shell: pwsh
        run: |
          $env:KSWORD_QT_DIR = $env:QT_ROOT_DIR
          $env:QTDIR = $env:QT_ROOT_DIR
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }

          # KswordSetup embeds the Release payload generated by the main project.
          # The private profile corpus is not tracked, so provide the same
          # compile-only fixture used by the regular user-mode CI.
          $ciProfiles = 'Ksword5.1/Ksword5.1/profiles'
          New-Item -ItemType Directory -Path $ciProfiles -Force | Out-Null
          @'
          {
            "packVersion": 3,
            "profiles": []
          }
          '@ | Set-Content -LiteralPath (Join-Path $ciProfiles 'ark_dyndata_pack_v3.json') -Encoding utf8

          $properties = @(
            '/t:Build',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            "/p:SolutionDir=$((Resolve-Path 'Ksword5.1').Path)\",
            "/p:QtMsBuild=$env:KSWORD_QT_MSBUILD",
            '/p:KswordArkSkipAutoTestSign=true',
            '/m:1',
            '/v:minimal'
          )
          & $msbuild 'Ksword5.1/Ksword5.1/Ksword5.1.vcxproj' @properties
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for Ksword5.1 payload prerequisite with exit code $LASTEXITCODE."
          }

          & $msbuild 'KswordSetup/KswordSetup.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordSetup with exit code $LASTEXITCODE."
          }

      - name: Verify KswordSetup artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'Ksword5.1/x64/Release/KswordSetup.exe',
            'Ksword5.1/x64/Release/KswordSetup.pdb'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected KswordSetup artifact(s) missing: $($missing -join ', ')"
          }

      - name: Upload KswordSetup artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordSetup-unsigned-Release
          path: |
            Ksword5.1/x64/Release/KswordSetup.exe
            Ksword5.1/x64/Release/KswordSetup.pdb
          if-no-files-found: error

  ksword-arklight:
    name: KswordARKLight Release build
    needs:
      - changes
      - source-integrity
    if: needs.changes.outputs.arklight == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build driver prerequisite and KswordARKLight
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }

          $solutionDir = (Resolve-Path 'Ksword5.1').Path + '\'
          & $msbuild 'KswordARKDriver/KswordARKDriver.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:SolutionDir=$solutionDir" `
            /p:KswordArkSkipAutoVariantSign=true `
            /p:KswordArkSkipAutoTestSign=true `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordARKDriver prerequisite with exit code $LASTEXITCODE."
          }

          & $msbuild 'KswordARKLight/KswordARKLight.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:KswordArkLightEnsureDriverBuilt=false `
            /p:KswordArkLightSkipDriverSign=true `
            /p:KswordArkLightReuseSignedDriver=true `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordARKLight with exit code $LASTEXITCODE."
          }

      - name: Verify KswordARKLight artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'Ksword5.1/x64/Release/KswordARKLight.exe',
            'KswordARKLight/generated/KswordARK.sys'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected KswordARKLight artifact(s) missing: $($missing -join ', ')"
          }

      - name: Upload KswordARKLight artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordARKLight-unsigned-Release
          path: |
            Ksword5.1/x64/Release/KswordARKLight.exe
            KswordARKLight/generated/KswordARK.sys
          if-no-files-found: error

  ksword-ce-plugin:
    name: KswordCheatEnginePlugin Release build (${{ matrix.platform }})
    needs:
      - changes
      - source-integrity
    if: needs.changes.outputs.ce_plugin == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build KswordCheatEnginePlugin
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }
          & $msbuild 'CheatEnginePlugin/KswordCheatEnginePlugin.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform='${{ matrix.platform }}' `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordCheatEnginePlugin (${{ matrix.platform }}) with exit code $LASTEXITCODE."
          }

      - name: Verify KswordCheatEnginePlugin artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'CheatEnginePlugin/${{ matrix.platform }}/Release/KswordCheatEnginePlugin.dll',
            'CheatEnginePlugin/${{ matrix.platform }}/Release/KswordCheatEnginePlugin.pdb'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected KswordCheatEnginePlugin artifact(s) missing: $($missing -join ', ')"
          }

      - name: Upload KswordCheatEnginePlugin artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordCheatEnginePlugin-${{ matrix.platform }}-Release
          path: |
            CheatEnginePlugin/${{ matrix.platform }}/Release/KswordCheatEnginePlugin.dll
            CheatEnginePlugin/${{ matrix.platform }}/Release/KswordCheatEnginePlugin.pdb
          if-no-files-found: error

  ksword-ce-launcher:
    name: KswordCheatEngineLauncher Release build
    needs:
      - changes
      - source-integrity
    if: needs.changes.outputs.ce_launcher == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build KswordCheatEngineLauncher
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }
          & $msbuild 'CheatEngineExecutablePlugin/KswordCheatEngineLauncher.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed for KswordCheatEngineLauncher with exit code $LASTEXITCODE."
          }

      - name: Verify KswordCheatEngineLauncher artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'CheatEngineExecutablePlugin/x64/Release/KswordCheatEngineLauncher.exe',
            'CheatEngineExecutablePlugin/x64/Release/KswordCheatEngineLauncher.pdb'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected KswordCheatEngineLauncher artifact(s) missing: $($missing -join ', ')"
          }

      - name: Upload KswordCheatEngineLauncher artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordCheatEngineLauncher-Release
          path: |
            CheatEngineExecutablePlugin/x64/Release/KswordCheatEngineLauncher.exe
            CheatEngineExecutablePlugin/x64/Release/KswordCheatEngineLauncher.pdb
          if-no-files-found: error
