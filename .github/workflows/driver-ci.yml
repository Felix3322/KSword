name: Driver CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driver-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect driver impact
    runs-on: ubuntu-latest
    outputs:
      driver: ${{ steps.detect.outputs.driver }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed driver inputs
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed='__all__'
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF" --depth=1
            base_sha="$(git merge-base "origin/$BASE_REF" "$EVENT_SHA")"
            changed="$(git diff --name-only "$base_sha" "$EVENT_SHA")"
          elif [[ -n "${EVENT_BEFORE:-}" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            changed="$(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA")"
          else
            changed="$(git diff --name-only HEAD~1 HEAD)"
          fi

          driver_re='^(KswordARKDriver/|shared/driver/|third_party/systeminformer_dyn/|\.github/workflows/driver-ci\.yml$)'

          # 回归保护：项目直接编译/包含的 System Informer 动态配置输入必须触发驱动构建。
          for driver_input in \
            'third_party/systeminformer_dyn/kphdyn.c' \
            'third_party/systeminformer_dyn/kphdyn.h' \
            'third_party/systeminformer_dyn/ksw_si_dynconfig.h'; do
            if ! printf '%s\n' "$driver_input" | grep -Eq "$driver_re"; then
              echo "$driver_input must trigger the driver build." >&2
              exit 1
            fi
          done

          driver=false
          if [[ "$changed" == '__all__' ]] || printf '%s\n' "$changed" | grep -Eq "$driver_re"; then
            driver=true
          fi
          echo "driver=$driver" >> "$GITHUB_OUTPUT"
          echo 'Changed paths:'
          printf '%s\n' "$changed"
          echo "Affected driver project: $driver"

  driver-release:
    name: Driver Release build
    needs: changes
    if: needs.changes.outputs.driver == 'true'
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify WDK integration
        shell: pwsh
        run: |
          $wdkTargets = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\build' `
            -Filter WindowsDriver.Common.targets -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $wdkTargets) {
            throw 'The windows-2022 runner does not expose WindowsKernelModeDriver10.0. Update the runner image or add an explicit WDK installation step.'
          }
          Write-Host "Using WDK targets: $($wdkTargets.FullName)"

      - name: Build unsigned Release driver
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw 'Could not locate MSBuild through vswhere.'
          }
          & $msbuild 'KswordARKDriver/KswordARKDriver.vcxproj' `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:KswordArkSkipAutoVariantSign=true `
            /p:KswordArkSkipAutoTestSign=true `
            /m:1 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "Driver MSBuild failed with exit code $LASTEXITCODE."
          }

      - name: Verify driver artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            'Ksword5.1/x64/Release/KswordARK.sys',
            'Ksword5.1/x64/Release/KswordARK.pdb',
            'Ksword5.1/x64/Release/KswordARKDriver.inf'
          )
          $missing = $artifacts | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Expected driver artifact(s) missing: $($missing -join ', ')"
          }

      - name: Upload driver artifacts
        uses: actions/upload-artifact@v6
        with:
          name: KswordARKDriver-unsigned-Release
          path: |
            Ksword5.1/x64/Release/KswordARK.sys
            Ksword5.1/x64/Release/KswordARK.pdb
            Ksword5.1/x64/Release/KswordARKDriver.inf
          if-no-files-found: error
